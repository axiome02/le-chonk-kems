[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "le-chonk-kems"
version = "0.1.0"
description = "A Multimodal Multi-Agent Game Harness for Mistral Large 4"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Axel Perchec", email = "axel.perchec@mines-albi.fr" }
]
keywords = ["mistral", "multi-agent", "game-theory", "steganography", "vision", "kems", "le-chonk"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests>=2.31.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
kems = "kems.run:main"
le-chonk = "kems.run:chonk_main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
py-modules = ["run_chonk"]

[tool.setuptools.packages.find]
where = ["."]
include = ["kems*"]
exclude = ["tests*", "dashboard*"]
